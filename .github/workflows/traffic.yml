# .github/workflows/traffic.yml
#
# Runs the traffic poller Tue–Fri, 6:20–7:00 AM Luxembourg/French time.
# Sends a Telegram update every ~10 min (5 messages per session).
# Luxembourg/France: UTC+1 (CET, winter) / UTC+2 (CEST, summer).
# GitHub Actions cron is UTC → 02:20 UTC target, +2h buffer for GH scheduling delay.
# Adjust winter cron to "03:20" UTC (Oct–Mar) for CET.
#
# Mon = 1, Tue = 2, Wed = 3, Thu = 4, Fri = 5 in cron day-of-week.

name: Traffic Poller

on:
  schedule:
    - cron: "20 2 * * 2-5"    # summer (CEST, UTC+2): targets 06:20 AM, +2h buffer for GH delay
    # - cron: "20 3 * * 2-5" # winter (CET,  UTC+1): targets 06:20 AM, +2h buffer for GH delay
  workflow_dispatch:          # allows manual "Run workflow" from GitHub UI for testing

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 50       # safety cap — poller runs 40 min
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "requests>=2.31,<3" "gspread>=6.0,<7" "google-auth>=2.28,<3"

      - name: Run traffic poller
        env:
          GOOGLE_MAPS_API_KEY:       ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SHEET_ID:           ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON:  ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poller.py
